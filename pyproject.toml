[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowmvp"
version = "0.2.0"
description = "Turn screen recordings or prose into executable Python workflows (Flask UI; Google Gemini codegen over a constrained tool registry)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kevin Meltzer", email = "KMeltzer24@users.noreply.github.com" }]
keywords = ["workflow", "automation", "gemini", "ai", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
]
dependencies = [
    "google-genai>=1.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "opencv-python-headless>=4.9.0.80",
    "flask>=2.3.0",
    "jinja2>=3.1.0",
    "yfinance>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/KMeltzer24/workflowMVP"
Issues = "https://github.com/KMeltzer24/workflowMVP/issues"

[project.scripts]
workflowmvp = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["workflowmvp*", "web*"]

[tool.setuptools.package-data]
"workflowmvp.prompts" = ["*.txt"]
"web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data",
    "examples",
    "web/static",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",   # line-too-long (long prompts/docstrings are fine)
    "B008",   # default arg as function call (Flask patterns)
    "UP006",  # Dict/List in annotations (style; optional modernize later)
    "UP035",  # typing imports deprecated in favor of builtins
    "UP045",  # Optional[X] vs X | None (style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=workflowmvp --cov-fail-under=80"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["workflowmvp"]
warn_unused_ignores = false
